<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · Rinde</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; background: #0b0c0e; color: #f3f4f6; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { padding: 32px; max-width: 520px; }
      p { color: #a3a8b1; font-size: 17px; line-height: 27px; }
      h1 { font-size: 34px; line-height: 38px; letter-spacing: -0.03em; margin: 12px 0; font-weight: 600; }
      small { color: #80868f; letter-spacing: 0.06em; text-transform: uppercase; font-size: 12px; }
      button { margin-top: 16px; background: #f3f4f6; color: #0b0c0e; border: 0; border-radius: 999px; padding: 12px 20px; font-size: 15px; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <small>Sin conexión</small>
      <h1>No hay internet ahora.</h1>
      <p>Los precios necesitan conexión: no te vamos a mostrar un dato viejo como si fuera de hoy. Tu cartera y tus alertas siguen guardadas en este dispositivo.</p>
      <button onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
