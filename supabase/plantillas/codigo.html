<!--
  Mail con el código para entrar. Va en Supabase → Authentication → Emails, en DOS plantillas:
  "Magic link" (usuarios que ya tienen cuenta) y "Confirm signup" (la primera vez).
  Asunto sugerido para las dos: Tu código para entrar
-->
<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 32px 24px; color: #141414;">
  <p style="font-size: 22px; font-weight: 700; margin: 0 0 24px;">rinde<span style="color: #ffc93c;">.</span></p>
  <p style="font-size: 16px; line-height: 1.5; margin: 0 0 16px;">Tu código para entrar es:</p>
  <p style="font-size: 32px; font-weight: 700; letter-spacing: 6px; margin: 0 0 24px;">{{ .Token }}</p>
  <p style="font-size: 15px; line-height: 1.5; color: #555; margin: 0 0 8px;">Escribilo en la pantalla donde lo pediste. Vence en una hora.</p>
  <p style="font-size: 13px; line-height: 1.5; color: #888; margin: 24px 0 0;">Si no lo pediste vos, ignorá este mail: nadie puede entrar sin el código.</p>
</div>
